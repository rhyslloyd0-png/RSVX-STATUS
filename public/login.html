<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0f">
<title>RSVX Status · Log in</title>
<style>
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0c0f; color: #ededf0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  form { width: min(340px, calc(100vw - 32px)); border: 1px solid #26262e; background: #131318; padding: 22px 20px; }
  .brand { font-weight: 700; letter-spacing: .14em; font-size: 13px; margin-bottom: 18px; }
  .brand span { color: #8457e6; }
  label { display: block; font-size: 12px; color: #8d8d9a; margin-bottom: 6px; }
  input { width: 100%; padding: 10px; font: inherit; color: inherit; background: #0c0c0f; border: 1px solid #26262e; }
  input:focus { outline: none; border-color: #8457e6; }
  button { width: 100%; margin-top: 14px; padding: 10px; font: inherit; font-weight: 600; color: #fff; background: #6f42d4; border: 0; cursor: pointer; }
  .wrong { color: #e5484d; font-size: 13px; margin-top: 10px; }
  p { margin: 16px 0 0; font-size: 12px; color: #8d8d9a; }
  a { color: inherit; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="brand">RSVX <span>STATUS</span></div>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Log in</button>
  <div class="wrong" id="wrong" hidden>That password is not right.</div>
  <p>Trouble getting in? <a href="mailto:rhys@rsvx.co.uk">rhys@rsvx.co.uk</a></p>
</form>
<script>if (location.search.indexOf('wrong') > -1) document.getElementById('wrong').hidden = false;</script>
</body>
</html>
