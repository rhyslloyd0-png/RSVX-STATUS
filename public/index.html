<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0f">
<title>RSVX Status</title>
<style>
  :root {
    --bg: #0c0c0f; --panel: #131318; --line: #26262e; --line-soft: #1c1c23;
    --text: #ededf0; --muted: #8d8d9a; --purple: #8457e6;
    --ok: #3fb950; --warn: #d9a520; --down: #e5484d; --pending: #4c8dff; --idle: #5c5c68;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; border-radius: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); padding: 7px 12px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--purple); outline: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; letter-spacing: .14em; font-size: 13px; }
  .brand span { color: var(--purple); }
  .checked { font: 12px var(--mono); color: var(--muted); text-align: right; }

  .banner { margin: 16px 0; padding: 18px 16px; border: 1px solid var(--line); border-left: 6px solid var(--idle); background: var(--panel); }
  .banner.ok { border-left-color: var(--ok); } .banner.warn { border-left-color: var(--warn); } .banner.down { border-left-color: var(--down); }
  .banner h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 650; }
  .banner p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .tally { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font: 12px var(--mono); color: var(--muted); }
  .tally b { color: var(--text); font-weight: 600; }

  section { margin-top: 22px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  h2 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .head .count { font: 12px var(--mono); color: var(--muted); }
  h3 { margin: 16px 0 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .row { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
  .dot { width: 10px; height: 10px; background: var(--idle); align-self: center; grid-row: 1; }
  .ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .down .dot { background: var(--down); }
  .pending .dot { background: var(--pending); } .idle .dot { background: transparent; border: 1px solid var(--idle); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .state { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
  .warn .state { color: var(--warn); } .down .state { color: var(--down); } .pending .state { color: var(--pending); } .ok .state { color: var(--ok); }
  .sub { grid-column: 2 / -1; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .sub .meta { font: 12px var(--mono); }
  .down .sub, .warn .sub { color: var(--text); }
  .idle .name { color: var(--muted); font-weight: 500; }

  .bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 22px; padding: 14px 0 6px; }
  .bar .top { display: flex; justify-content: space-between; font: 12px var(--mono); }
  .bar .top b { font-weight: 600; }
  .track { height: 8px; background: var(--line-soft); margin: 6px 0 4px; }
  .fill { height: 100%; background: var(--purple); }
  .fill.hot { background: var(--warn); } .fill.full { background: var(--down); }
  .bar small { color: var(--muted); font: 11px var(--mono); }

  .more { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .log .row { grid-template-columns: 12px 1fr auto; }
  .empty { padding: 12px 0; color: var(--muted); font-size: 13px; }
  footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  footer a:hover { color: var(--text); }

  @media (min-width: 860px) {
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }
    .banner h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">RSVX <span>STATUS</span></div>
    <div class="checked" id="checked">loading</div>
  </header>

  <div class="banner" id="banner">
    <h1 id="headline">Checking everything</h1>
    <p id="subline">First results arrive within a minute.</p>
    <div class="tally" id="tally"></div>
  </div>

  <section id="attention" hidden>
    <div class="head"><h2>Needs attention</h2><span class="count" id="attention-count"></span></div>
    <div id="attention-rows"></div>
  </section>

  <div class="cols">
    <div>
      <section>
        <div class="head"><h2>VPS</h2><span class="count" id="vps-count"></span></div>
        <div id="vps"></div>
      </section>
      <section>
        <div class="head"><h2>Websites and SSL</h2><span class="count" id="sites-count"></span></div>
        <div id="sites"></div>
      </section>
    </div>
    <div>
      <section>
        <div class="head"><h2>Render</h2><span class="count" id="render-count"></span></div>
        <div id="render"></div>
      </section>
      <section>
        <div class="head"><h2>GitHub</h2><span class="count" id="github-count"></span></div>
        <div id="github"></div>
        <button class="more" id="gh-toggle" hidden></button>
      </section>
    </div>
  </div>

  <section class="log">
    <div class="head"><h2>Recent changes</h2></div>
    <div id="events"></div>
  </section>

  <footer>
    <span>RSVX Developments · <a href="mailto:rhys@rsvx.co.uk">rhys@rsvx.co.uk</a></span>
    <span><button id="recheck">Check now</button> <a href="/logout" style="margin-left:10px">Log out</a></span>
  </footer>
</div>

<script>
(function () {
  var WORD = { ok: 'OK', warn: 'Warning', down: 'Failed', pending: 'Working', idle: 'Off' };
  var GROUP = { vps: 'VPS', render: 'Render', github: 'GitHub', sites: 'Websites' };
  var showAllRepos = false;
  var last = null;
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ago(t) {
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + 's';
    var m = Math.round(s / 60); if (m < 60) return m + 'm';
    var h = Math.round(m / 60); if (h < 48) return h + 'h';
    return Math.round(h / 24) + 'd';
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }

  function row(c, withGroup) {
    var name = esc(c.name) + (withGroup ? ' <span class="state" style="margin-left:6px">' + esc(GROUP[c.group] || '') + '</span>' : '');
    var url = safeUrl(c.url);
    if (url) name = '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + name + '</a>';
    var sub = esc(c.summary || '');
    if (c.meta) sub += (sub ? ' <span class="meta">· ' : '<span class="meta">') + esc(c.meta) + '</span>';
    return '<div class="row ' + esc(c.status) + '"><span class="dot"></span><span class="name">' + name + '</span>' +
      '<span class="state">' + WORD[c.status] + '</span><span class="sub">' + sub + '</span></div>';
  }
  function rows(list, emptyText) {
    return list.length ? list.map(function (c) { return row(c); }).join('') : '<div class="empty">' + esc(emptyText) + '</div>';
  }
  function count(list) {
    var live = list.filter(function (c) { return c.status !== 'idle'; });
    var bad = live.filter(function (c) { return c.status === 'down' || c.status === 'warn'; }).length;
    if (!live.length) return '';
    return bad ? bad + ' of ' + live.length + ' need attention' : live.length + ' ok';
  }

  function renderVps(list) {
    var host = list.filter(function (c) { return c.kind === 'host'; })[0];
    var svc = list.filter(function (c) { return c.kind === 'service'; });
    var repos = list.filter(function (c) { return c.kind === 'repo'; });
    var other = list.filter(function (c) { return !c.kind; });
    var html = '';
    if (host) {
      html += row(host);
      if (host.bars && host.bars.length) {
        html += '<div class="bars">' + host.bars.map(function (b) {
          var v = Math.max(0, Math.min(100, b.value));
          var cls = v >= 95 ? 'full' : v >= 85 ? 'hot' : '';
          return '<div class="bar"><div class="top"><b>' + esc(b.label) + '</b><span>' + Math.round(v) + '%</span></div>' +
            '<div class="track"><div class="fill ' + cls + '" style="width:' + v.toFixed(1) + '%"></div></div><small>' + esc(b.text || '') + '</small></div>';
        }).join('') + '</div>';
      }
    }
    html += other.map(function (c) { return row(c); }).join('');
    if (svc.length) html += '<h3>Services</h3>' + rows(svc, '');
    if (repos.length) html += '<h3>Repos on the VPS</h3>' + rows(repos, '');
    $('vps').innerHTML = html || '<div class="empty">Waiting for the first check.</div>';
  }

  function render(d) {
    last = d;
    var by = function (g) { return d.checks.filter(function (c) { return c.group === g; }); };
    var bad = d.checks.filter(function (c) { return c.status === 'down' || c.status === 'warn'; });
    var live = d.checks.filter(function (c) { return c.status !== 'idle'; });

    $('banner').className = 'banner ' + (d.ready ? d.overall : '');
    if (!d.ready) {
      $('headline').textContent = 'Checking everything';
      $('subline').textContent = 'First results arrive within a minute.';
    } else if (bad.length) {
      $('headline').textContent = bad.length + (bad.length === 1 ? ' thing needs attention' : ' things need attention');
      $('subline').textContent = (live.length - bad.length) + ' of ' + live.length + ' checks are passing.';
    } else {
      $('headline').textContent = 'All systems running';
      $('subline').textContent = 'All ' + live.length + ' checks are passing.';
    }
    $('tally').innerHTML = ['vps', 'render', 'github', 'sites'].map(function (g) {
      var l = by(g).filter(function (c) { return c.status !== 'idle'; });
      var b = l.filter(function (c) { return c.status === 'down' || c.status === 'warn'; }).length;
      return '<span>' + GROUP[g] + ' <b>' + (l.length ? (l.length - b) + '/' + l.length : 'off') + '</b></span>';
    }).join('');
    $('checked').textContent = 'checked ' + ago(d.generatedAt) + ' ago';

    $('attention').hidden = !bad.length;
    $('attention-count').textContent = bad.length;
    $('attention-rows').innerHTML = bad.map(function (c) { return row(c, true); }).join('');

    renderVps(by('vps'));
    $('vps-count').textContent = count(by('vps'));

    $('render').innerHTML = rows(by('render'), 'Waiting for the first check.');
    $('render-count').textContent = count(by('render'));

    $('sites').innerHTML = rows(by('sites'), 'Waiting for the first check.');
    $('sites-count').textContent = count(by('sites'));

    var gh = by('github');
    var shown = showAllRepos ? gh : gh.filter(function (c) { return c.status !== 'ok' || c.recent; });
    $('github').innerHTML = rows(shown, gh.length ? 'No pushes in the last 7 days and nothing failing.' : 'Waiting for the first check.');
    $('github-count').textContent = count(gh);
    var toggle = $('gh-toggle');
    toggle.hidden = gh.length <= shown.length && !showAllRepos;
    toggle.textContent = showAllRepos ? 'Show only recent and failing' : 'Show all ' + gh.length + ' repos';

    $('events').innerHTML = d.events.length ? d.events.map(function (e) {
      var when = new Date(e.t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return '<div class="row ' + esc(e.to) + '"><span class="dot"></span><span class="name">' + esc(e.name) +
        ' <span class="state" style="margin-left:6px">' + esc(GROUP[e.group] || '') + '</span></span><span class="state">' + esc(when) +
        '</span><span class="sub">' + (e.to === 'ok' ? 'Recovered. ' : '') + esc(e.summary || '') + '</span></div>';
    }).join('') : '<div class="empty">Nothing has changed since the board started.</div>';
  }

  function load() {
    fetch('/api/status', { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { location.href = '/login'; return null; }
      return r.json();
    }).then(function (d) { if (d) render(d); }).catch(function () {
      $('checked').textContent = 'cannot reach the status board';
    });
  }

  $('gh-toggle').addEventListener('click', function () { showAllRepos = !showAllRepos; if (last) render(last); });
  $('recheck').addEventListener('click', function () {
    var b = this; b.disabled = true; b.textContent = 'Checking';
    fetch('/api/recheck', { method: 'POST', credentials: 'same-origin' }).finally(function () {
      setTimeout(function () { load(); b.disabled = false; b.textContent = 'Check now'; }, 6000);
    });
  });
  setInterval(function () { if (last) $('checked').textContent = 'checked ' + ago(last.generatedAt) + ' ago'; }, 5000);
  setInterval(load, 20000);
  load();
})();
</script>
</body>
</html>
